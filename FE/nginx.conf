server {
    listen 80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy API calls to the backend container (same-origin -> no CORS).
    # The FE is built with VITE_API_BASE_URL=/api, so every request hits /api/*.
    location /api/ {
        proxy_pass         http://be:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: let the client router handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
