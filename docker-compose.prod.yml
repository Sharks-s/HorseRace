# Production compose — runs on the deploy host.
# Uses images built & pushed by CI (no build context here).
# IMAGE_PREFIX and IMAGE_TAG are injected via the .env the deploy job writes.
services:
  db:
    image: postgres:15-alpine
    container_name: horserace_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-horserace}
    # Per deployment diagram: db exposed 5432:5432.
    # SECURITY: restrict to localhost (DB_PORT=127.0.0.1:5432) or firewall in prod.
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-horserace}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  be:
    image: ${IMAGE_PREFIX}/horserace-be:${IMAGE_TAG:-latest}
    container_name: horserace_be
    depends_on:
      db:
        condition: service_healthy
    # Per deployment diagram: browser calls the API directly at be:8080/api.
    ports:
      - "${BE_PORT:-8080}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-horserace}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SQL_INIT_MODE=${SQL_INIT_MODE:-always}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://localhost}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      - HORSE_MAX_WEIGHT=${HORSE_MAX_WEIGHT:-650}
    restart: always

  fe:
    image: ${IMAGE_PREFIX}/horserace-fe:${IMAGE_TAG:-latest}
    container_name: horserace_fe
    ports:
      - "${FE_PORT:-80}:80"
    depends_on:
      - be
    restart: always

volumes:
  postgres_data:
