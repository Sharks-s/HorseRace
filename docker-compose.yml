version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: horserace_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-horserace}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  be:
    image: ghcr.io/lamphuoc-nguyen/horserace-be:latest
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: horserace_be
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-horserace}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://localhost}
      - HORSE_MAX_WEIGHT=${HORSE_MAX_WEIGHT:-650}
    restart: always

  fe:
    image: ghcr.io/lamphuoc-nguyen/horserace-fe:latest
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: horserace_fe
    ports:
      - "80:80"
    depends_on:
      - be
    restart: always

volumes:
  postgres_data:
