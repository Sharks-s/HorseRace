name: CI/CD

# ---------------------------------------------------------------------------
# Pipeline: test  ->  build & push images (GHCR)  ->  deploy over SSH
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST        SSH host / IP of the deploy server
#   DEPLOY_USER        SSH user (must be in the docker group)
#   DEPLOY_SSH_KEY     Private SSH key for that user (PEM, no passphrase)
#   POSTGRES_PASSWORD  Production DB password
#   APP_FRONTEND_URL   Public URL of the frontend (e.g. https://horserace.example.com)
#   SMTP_USERNAME      (optional) SMTP user for outbound mail
#   SMTP_PASSWORD      (optional) SMTP password
# GHCR auth uses the built-in GITHUB_TOKEN — no secret needed.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: horserace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Runs against a real Postgres so the data.sql seed path is exercised in CI.
      - name: mvn verify
        working-directory: be
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/horserace
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SQL_INIT_MODE: always
        run: mvn -B --no-transfer-progress verify

  # -------------------------------------------------------------------------
  test-frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - name: Install
        working-directory: FE
        run: npm ci
      # Non-blocking for now — flip to a plain `npm run lint` once the tree is clean.
      - name: Lint
        working-directory: FE
        continue-on-error: true
        run: npm run lint
      - name: Build
        working-directory: FE
        run: npm run build

  # -------------------------------------------------------------------------
  build-and-push:
    name: Build & push images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./be
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/horserace-be:latest
            ${{ env.IMAGE_PREFIX }}/horserace-be:${{ github.sha }}
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./FE
          push: true
          # Diagram: browser calls the backend directly. Set repo variable
          # VITE_API_BASE_URL to http://<HOST>:8080/api (Settings > Variables).
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'http://localhost:8080/api' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/horserace-fe:latest
            ${{ env.IMAGE_PREFIX }}/horserace-fe:${{ github.sha }}

  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to host
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Copy compose file to host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ~/horserace
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/horserace
            cat > .env <<EOF
            IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}
            IMAGE_TAG=${{ github.sha }}
            POSTGRES_USER=postgres
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=horserace
            SQL_INIT_MODE=always
            APP_FRONTEND_URL=${{ secrets.APP_FRONTEND_URL }}
            APP_CORS_ALLOWED_ORIGINS=${{ vars.APP_CORS_ALLOWED_ORIGINS || secrets.APP_FRONTEND_URL }}
            SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            FE_PORT=80
            BE_PORT=8080
            DB_PORT=127.0.0.1:5432
            EOF
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
