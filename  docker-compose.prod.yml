version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: horserace_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  be:
    image: ${DOCKER_USERNAME}/horserace-be:latest
    container_name: horserace_be
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    restart: always

  fe:
    image: ${DOCKER_USERNAME}/horserace-fe:latest
    container_name: horserace_fe
    ports:
      - "80:80"
    depends_on:
      - be
    restart: always

volumes:
  postgres_data: