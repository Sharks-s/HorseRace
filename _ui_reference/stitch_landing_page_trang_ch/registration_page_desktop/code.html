<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col md:flex-row antialiased">
<!-- Left Section with Image Overlay -->
<div class="relative hidden md:flex w-1/2 bg-cover bg-center" data-alt="A dynamic, high-contrast photograph of thoroughbred horses racing around a dirt track, kicking up dust in the golden hour sunlight. The scene embodies high-energy sports and prestige, rendered in a sophisticated palette of deep greens and earthy browns. The lighting is cinematic, highlighting the speed and intensity of the moment." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCXgTNJ62MO6xTWFx1JM6EwqN0jeeKNCQCVOR8V9xUamSGFIOhs_DJs7ByjbwOSOceGx-sYImlMmZTUiaWmUkpdE53isA0I-lqtJbX-rL4kq0kVXdHhQ7pfMT4LsIk2zIEChhYHtSzNMvwOUpTye0U-ntPygQUtj5EOqJ7sE4L0-ATEm21P-_8ncGKDoZ94ek3eR3dmvMQth4Jb13dNdx-2l8sjaO-cvajnMT61ATWHMsxlc1fdCxr_b-zUwwctxK8eCtEs_Eu0xg');">
<div class="absolute inset-0 bg-gradient-to-t from-primary/90 to-primary/40 flex flex-col justify-end p-12 lg:p-24">
<div class="max-w-xl">
<h1 class="font-display-lg text-[64px] leading-tight text-secondary-fixed mb-4 drop-shadow-md">HorseRace</h1>
<p class="font-body-lg text-2xl text-inverse-on-surface opacity-90">Digital Tournament Management</p>
</div>
</div>
</div>
<!-- Right Main Registration Form -->
<main class="w-full md:w-1/2 flex items-center justify-center p-6 sm:p-12 lg:p-24 bg-surface-container-lowest h-screen overflow-y-auto">
<div class="w-full max-w-xl space-y-10">
<div class="space-y-2 text-center md:text-left">
<h2 class="font-display-lg text-4xl text-primary">Create Account</h2>
<p class="font-body-lg text-on-surface-variant">Join the professional racing network.</p>
</div>
<form class="space-y-6">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Full Name -->
<div class="space-y-2 md:col-span-2">
<label class="font-label-bold text-label-bold text-on-surface block" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg">person</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-surface rounded-xl border border-outline-variant text-on-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-colors" id="fullName" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-2 md:col-span-2">
<label class="font-label-bold text-label-bold text-on-surface block" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg">mail</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-surface rounded-xl border border-outline-variant text-on-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-colors" id="email" placeholder="john@stables.com" type="email"/>
</div>
</div>
<!-- Phone -->
<div class="space-y-2 md:col-span-2">
<label class="font-label-bold text-label-bold text-on-surface block" for="phone">Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg">call</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-surface rounded-xl border border-outline-variant text-on-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-colors" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<!-- Role Selector -->
<div class="space-y-2 md:col-span-2">
<label class="font-label-bold text-label-bold text-on-surface block" for="role">Primary Role</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg pointer-events-none z-10">badge</span>
<select class="w-full pl-12 pr-12 py-3.5 bg-surface rounded-xl border border-outline-variant text-on-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-colors appearance-none cursor-pointer" id="role">
<option disabled="" selected="" value="">Select a role...</option>
<option value="spectator">Spectator</option>
<option value="owner">Horse Owner</option>
<option value="jockey">Jockey</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline text-lg pointer-events-none">expand_more</span>
</div>
</div>
<!-- Password -->
<div class="space-y-2 md:col-span-2">
<label class="font-label-bold text-label-bold text-on-surface block" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg">lock</span>
<input class="w-full pl-12 pr-12 py-3.5 bg-surface rounded-xl border border-outline-variant text-on-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-colors" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-lg" id="visibilityIcon">visibility</span>
</button>
</div>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-[#D4AF37] hover:bg-secondary-container text-primary font-label-bold text-lg py-4 rounded-xl transition-transform active:scale-[0.98] shadow-sm mt-8 flex items-center justify-center gap-2" type="submit">
                    Create Account
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<div class="pt-8 border-t border-outline-variant flex flex-col md:flex-row items-center justify-between gap-6">
<a class="font-body-md text-on-surface-variant hover:text-primary transition-colors" href="#">
                    Already have an account? <span class="text-primary font-label-bold underline underline-offset-4">Login</span>
</a>
<div class="inline-flex items-center gap-2 px-4 py-2 bg-surface-container-low rounded-full border border-outline-variant">
<span class="material-symbols-outlined text-sm text-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">security</span>
<span class="font-label-sm text-on-surface-variant">JWT Security Active</span>
</div>
</div>
</div>
</main>
<script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const icon = document.getElementById('visibilityIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }
    </script>
</body></html>
