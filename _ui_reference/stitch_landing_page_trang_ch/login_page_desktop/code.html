<body class="bg-surface font-body-md text-on-surface selection:bg-secondary-container selection:text-on-secondary-container">
<main class="min-h-screen flex flex-col md:flex-row overflow-hidden">

<div class="absolute inset-0 z-0">
<img alt="Prestigious horse racing action" class="w-full h-full object-cover" data-alt="A dynamic, high-action photograph of a thoroughbred horse and jockey in mid-gallop on a pristine green turf track. The lighting is golden hour, creating long shadows and highlighting the powerful muscle definition of the horse. The style is professional sports photography with a cinematic depth of field, using the brand's deep racing green and championship gold tones in the environment. The atmosphere is prestigious, high-stakes, and focused on athletic excellence." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBsEgMuszQnoXwKOiqNHdOHjC-2usZuTXzTuWciTVehNeDBItfYlBvWPmurH165aiJybVRW3T_ltW3p-P7Ox3JrQRfZ0NROKpALWU7TwAE0FzfBtoGYftwiUJGkdO80XYNREwi-wIPS0xtNgZff7Hz7bJ3HCCSRQwtfLEveopF4d38a8GqiXe1bzWVoSHHyYVK10jAPsHzLZjng5RU_8G7xSJQZQfYQZ7xEZdllL-q88beFKecpeLQE82hSTfnxLDw-DkzjBq-BEA"/>
<div class="absolute inset-0 split-bg-overlay"></div>
</div>
<!-- Branding Overlay -->
<div class="relative z-10 p-12 text-center">
<div class="mb-6 flex items-center justify-center gap-3">
<span class="material-symbols-outlined text-secondary-container text-6xl" style="font-variation-settings: 'FILL' 1;">speed</span>

</div>

                    Digital Tournament Management
                </p>
<div class="mt-12 h-1 w-24 bg-secondary-container mx-auto rounded-full"></div>
</div>
<!-- Aesthetic Accent -->
<div class="absolute bottom-8 left-8 border-l-4 border-secondary-container pl-4 opacity-70">
<p class="font-label-bold text-label-bold text-surface-container-lowest tracking-widest uppercase">Est. 1884</p>
<p class="font-label-sm text-label-sm text-on-primary-container">Championship Standards</p>
</div>
</section>
<!-- Right Side: Login Form -->
<section class="flex-1 flex flex-col items-center justify-center p-gutter md:p-12 lg:p-24 bg-surface min-h-screen">
<!-- Mobile Header (Visible only on small screens) -->
<div class="md:hidden mb-8 text-center">
<div class="flex items-center justify-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">speed</span>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">TURF &amp; THOROUGHBRED</h2>
</div>
</div>
<div class="w-full max-w-md">
<header class="mb-10">
<h2 class="font-headline-lg text-headline-lg text-primary mb-2">Login</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Access your stable and racing stats</p>
</header>
<form class="space-y-6" onsubmit="return false">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-bold text-label-bold text-on-surface" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md text-on-surface placeholder:text-outline-variant" id="email" name="email" placeholder="name@stable.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-bold text-label-bold text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative group" id="password-container">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full pl-11 pr-12 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md text-on-surface placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="w-full bg-secondary-container hover:bg-secondary-fixed transition-all duration-300 py-4 px-6 rounded-lg flex items-center justify-center gap-3 group active:scale-[0.98]" type="submit">
<span class="font-label-bold text-label-bold text-on-secondary-container tracking-wider uppercase">LOGIN</span>
<span class="material-symbols-outlined text-on-secondary-container group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<footer class="mt-12 space-y-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Don't have an account? 
                        <a class="text-primary font-label-bold hover:underline" href="#">Sign Up</a>
</p>
<!-- Security Badge -->
<div class="flex items-center justify-center gap-2 bg-surface-container-high py-2 px-4 rounded-full w-fit mx-auto">
<span class="material-symbols-outlined text-primary text-[18px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">JWT Security Active</span>
</div>
</footer>
</div>
<!-- Contextual Footer Links -->
<div class="absolute bottom-8 flex gap-6 text-outline font-label-sm text-label-sm">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="hover:text-primary transition-colors" href="#">Support</a>
</div>

</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerText = 'visibility';
            }
        }

        // Simple form interaction feedback
        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('click', (e) => {
            if (document.getElementById('email').value && document.getElementById('password').value) {
                loginBtn.innerHTML = `
                    <svg class="animate-spin h-5 w-5 text-on-secondary-container" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="font-label-bold text-label-bold text-on-secondary-container">VERIFYING...</span>
                `;
                setTimeout(() => {
                    loginBtn.innerHTML = `
                        <span class="font-label-bold text-label-bold text-on-secondary-container tracking-wider uppercase">LOGIN</span>
                        <span class="material-symbols-outlined text-on-secondary-container">arrow_forward</span>
                    `;
                }, 2000);
            }
        });
    </script>
